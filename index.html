<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ARCHITECT</title>
<style>

:root {
  --neon-cyan: #00ffff;
  --neon-glow: rgba(0, 255, 255, 0.4);
  --deep-bg: #050505;
  --panel-bg: rgba(10, 10, 10, 0.98);
  --border-dim: #222222;
  --text-main: #ffffff;
  --text-dim: #666666;
}

* {
  margin-top: 0px;
  margin-bottom: 0px;
  margin-left: 0px;
  margin-right: 0px;
  padding-top: 0px;
  padding-bottom: 0px;
  padding-left: 0px;
  padding-right: 0px;
  box-sizing: border-box;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -khtml-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

html {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: var(--deep-bg);
  font-family: 'Courier New', Courier, monospace;
  position: fixed;
  top: 0;
  left: 0;
}

#canvas-container {
  position: absolute;
  top: 0px;
  left: 0px;
  width: 100vw;
  height: 100vh;
  z-index: 1;
  display: block;
  overflow: hidden;
}

canvas {
  position: absolute;
  top: 0px;
  left: 0px;
  display: block;
  image-rendering: -moz-crisp-edges;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  touch-action: none; 
}

#main-canvas {
  z-index: 10;
}

#temp-canvas {
  z-index: 20;
  pointer-events: auto;
}

.architect-dock {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 15px;
  padding-left: 25px;
  padding-right: 25px;
  padding-top: 15px;
  padding-bottom: 15px;
  background-color: var(--panel-bg);
  border-top-width: 1px;
  border-top-style: solid;
  border-top-color: var(--neon-cyan);
  border-bottom-width: 1px;
  border-bottom-style: solid;
  border-bottom-color: var(--neon-cyan);
  border-left-width: 1px;
  border-left-style: solid;
  border-left-color: var(--neon-cyan);
  border-right-width: 1px;
  border-right-style: solid;
  border-right-color: var(--neon-cyan);
  border-top-left-radius: 60px;
  border-top-right-radius: 60px;
  border-bottom-left-radius: 60px;
  border-bottom-right-radius: 60px;
  box-shadow: 0px 0px 25px var(--neon-glow);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  transition-property: transform, bottom;
  transition-duration: 0.4s;
  transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
}

.tool-button {
  width: 55px;
  height: 55px;
  border-top-left-radius: 50%;
  border-top-right-radius: 50%;
  border-bottom-left-radius: 50%;
  border-bottom-right-radius: 50%;
  background-color: #111111;
  border-width: 1px;
  border-style: solid;
  border-color: #333333;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.tool-button span {
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 1px;
}

.tool-button.active {
  border-color: var(--neon-cyan);
  background-color: #000000;
  box-shadow: 0px 0px 12px var(--neon-glow);
}

.tool-button.active span {
  color: var(--neon-cyan);
}

.vault-overlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.85);
  width: 90%;
  max-width: 400px;
  background-color: var(--panel-bg);
  border: 2px solid var(--neon-cyan);
  padding: 40px;
  z-index: 5000;
  display: none;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
}

.vault-overlay.active {
  display: block;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.vault-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.vault-slot {
  background-color: #000000;
  border: 1px solid #222222;
  padding: 20px;
  text-align: center;
}

.v-spacer { height: 20px; }

</style>
</head>
<body>

<div id="canvas-container">
  <canvas id="main-canvas"></canvas>
  <canvas id="temp-canvas"></canvas>
</div>

<div class="architect-dock" id="ui-dock">
  <div class="tool-button active" id="btn-draw" onclick="setMode('draw')"><span>DRAW</span></div>
  <div class="tool-button" id="btn-bridge" onclick="setMode('bridge')"><span>BRDG</span></div>
  <div class="tool-button" id="btn-paste" onclick="setMode('paste')"><span>PST</span></div>
  <div class="tool-button" onclick="executeUndo()"><span>UNDO</span></div>
  <div class="tool-button" onclick="toggleVault()"><span>VLT</span></div>
</div>

<div class="vault-overlay" id="vault-system">
  <div class="vault-grid">
    <div class="vault-slot" onclick="saveToSlot(1)">SAVE_1</div>
    <div class="vault-slot" onclick="loadFromSlot(1)">LOAD_1</div>
    <div class="vault-slot" onclick="saveToSlot(2)">SAVE_2</div>
    <div class="vault-slot" onclick="loadFromSlot(2)">LOAD_2</div>
  </div>
  <div class="v-spacer"></div>
  <button onclick="toggleVault()" style="width:100%; padding:15px; background:none; border:1px solid var(--neon-cyan); color:var(--neon-cyan);">EXIT</button>
</div>

<script>
   const state = {
  mode: 'draw',
  drawing: false,
  locked: false,
  sticker: null,
  stickerX: 100,
  stickerY: 100,
  anchorX: 0,
  anchorY: 0,
  pathHistory: [],
  currentPath: [],
  dpr: window.devicePixelRatio || 1,
  color: '#00ffff',
  weight: 2
};
   
function loadSticker(url) {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    state.sticker = img;
    state.stickerX = 100;
    state.stickerY = 100;
    console.log("STICKER_LOADED");
  };
  img.src = url;
}

loadSticker('https://api.dicebear.com/7.x/identicon/svg?seed=arch');

const mainCanvas = document.getElementById('main-canvas');
const tempCanvas = document.getElementById('temp-canvas');
const mctx = mainCanvas.getContext('2d', { willReadFrequently: true });
const tctx = tempCanvas.getContext('2d', { willReadFrequently: true });


let bridgeOrigin = { x: 0, y: 0 };

function initialize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  mainCanvas.width = tempCanvas.width = w * state.dpr;
  mainCanvas.height = tempCanvas.height = h * state.dpr;
  mainCanvas.style.width = tempCanvas.style.width = w + 'px';
  mainCanvas.style.height = tempCanvas.style.height = h + 'px';
  mctx.scale(state.dpr, state.dpr);
  tctx.scale(state.dpr, state.dpr);
  mctx.lineCap = tctx.lineCap = 'round';
  mctx.lineJoin = tctx.lineJoin = 'round';
  mctx.strokeStyle = tctx.strokeStyle = state.color;
  mctx.lineWidth = tctx.lineWidth = state.weight;
}

function getCoords(e) {
  const t = e.touches[0];
  const vv = window.visualViewport;
  return {
    x: (t.pageX - (vv ? vv.pageLeft : 0)) / (vv ? vv.scale : 1),
    y: (t.pageY - (vv ? vv.pageTop : 0)) / (vv ? vv.scale : 1)
  };
}

function syncUI() {
  const vv = window.visualViewport;
  if (!vv) return;
  const dock = document.getElementById('ui-dock');
  const inv = 1 / vv.scale;
  window.requestAnimationFrame(() => {
    dock.style.transform = `translateX(-50%) scale(${inv})`;
    dock.style.bottom = `${30 * inv}px`;
  });
}

function setMode(m) {
  if (state.locked) return;
  state.mode = m;
  document.querySelectorAll('.tool-button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
}

function start(e) {
  if (e.target.closest('.architect-dock') || e.target.closest('.vault-overlay')) return;
  const p = getCoords(e);
  state.drawing = true;
  if (state.mode === 'bridge') {
    bridgeOrigin = { x: p.x, y: p.y };
  } else if (state.mode === 'paste' && state.sticker) {
    state.anchorX = p.x - state.stickerX;
    state.anchorY = p.y - state.stickerY;
  }
  mctx.beginPath();
  mctx.moveTo(p.x, p.y);
}

function move(e) {
  if (!state.drawing) return;
  const p = getCoords(e);
  tctx.clearRect(0, 0, tempCanvas.width / state.dpr, tempCanvas.height / state.dpr);
  if (state.mode === 'draw') {
    state.currentPath.push({x: p.x, y: p.y}); // <--- ADD THIS LINE
    mctx.lineTo(p.x, p.y);
    mctx.stroke();
  }
  } else if (state.mode === 'paste' && state.sticker) {
    state.stickerX = p.x - state.anchorX;
    state.stickerY = p.y - state.anchorY;
    tctx.globalAlpha = 0.5;
    tctx.drawImage(state.sticker, state.stickerX, state.stickerY);
    tctx.globalAlpha = 1.0;
  } else if (state.mode === 'bridge') {
    tctx.beginPath();
    tctx.moveTo(bridgeOrigin.x, bridgeOrigin.y);
    tctx.lineTo(p.x, p.y);
    tctx.stroke();
  }
  

   
function end() {
  if (!state.drawing) return;
  if (state.mode === 'bridge' || state.mode === 'paste') {
    mctx.drawImage(tempCanvas, 0, 0, tempCanvas.width / state.dpr, tempCanvas.height / state.dpr);
  }
  if (state.mode === 'draw') {
    state.pathHistory.push([...state.currentPath]);
  }
  state.drawing = false;
  state.currentPath = [];
  tctx.clearRect(0, 0, tempCanvas.width / state.dpr, tempCanvas.height / state.dpr);
}

   function executeUndo() {
  if (state.pathHistory.length === 0) return;
  
  // Get the last line
  const lastPath = state.pathHistory.pop();
  
  // Switch brush to "Eraser" mode
  mctx.globalCompositeOperation = 'destination-out';
  mctx.beginPath();
  mctx.lineWidth = state.weight + 2; // Slightly wider to ensure it clears the glow
  
  // Re-trace the line to carve it out
  lastPath.forEach((p, i) => {
    if (i === 0) mctx.moveTo(p.x, p.y);
    else mctx.lineTo(p.x, p.y);
  });
  
  mctx.stroke();
  
  mctx.globalCompositeOperation = 'source-over';
   }

function toggleVault() {
  document.getElementById('vault-system').classList.toggle('active');
}

function saveToSlot(s) {
  const data = {
    img: mainCanvas.toDataURL(),
    paths: state.pathHistory
  };
  localStorage.setItem('ARCH_S' + s, JSON.stringify(data));
}

function loadFromSlot(s) {
  const raw = localStorage.getItem('ARCH_S' + s);
  if (!raw) return;
  const data = JSON.parse(raw);
  const img = new Image();
  img.onload = () => {
    mctx.clearRect(0, 0, mainCanvas.width / state.dpr, mainCanvas.height / state.dpr);
    mctx.drawImage(img, 0, 0, mainCanvas.width / state.dpr, mainCanvas.height / state.dpr);
    state.pathHistory = data.paths || [];
  };
  img.src = data.img;
}

window.addEventListener('load', initialize);
window.addEventListener('resize', initialize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', syncUI);
  window.visualViewport.addEventListener('scroll', syncUI);
}
tempCanvas.addEventListener('touchstart', start, {passive: false});
tempCanvas.addEventListener('touchmove', move, {passive: false});
tempCanvas.addEventListener('touchend', end);

for (let i = 0; i < 400; i++) {
}

console.log("ARCHITECT_SUBSTRATE_LOAD_COMPLETE");
</script>
</body>
</html>
